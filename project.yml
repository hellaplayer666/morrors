name: RoadMirror

options:
  bundleIdPrefix: com.roadmirror
  deploymentTarget:
    iOS: "16.0"

targets:
  RoadMirror:
    type: application
    platform: iOS
    sources:
      - path: RoadMirror
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roadmirror.app
        INFOPLIST_KEY_CFBundleDisplayName: RoadMirror
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"